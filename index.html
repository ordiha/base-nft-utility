<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Base NFT Utility + WalletConnect</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/web3-provider/dist/umd/index.min.js"></script>
</head>
<body>
  <h1>Base NFT Utility dApp</h1>

  <button id="btnConnect">🔗 Connect Wallet</button>
  <p id="walletAddress">Not connected</p>

  <h2>Contracts</h2>
  <div id="contracts">
    <button onclick="interactContract('GiveawayNFT')">🎁 GiveawayNFT</button>
    <button onclick="interactContract('DonationTracker')">💰 DonationTracker</button>
    <button onclick="interactContract('VotingSystem')">🗳️ VotingSystem</button>
    <button onclick="interactContract('Escrow')">🤝 Escrow</button>
    <button onclick="interactContract('SubscriptionService')">📅 SubscriptionService</button>
    <button onclick="interactContract('Crowdfunding')">🌍 Crowdfunding</button>
    <button onclick="interactContract('Lottery')">🎟️ Lottery</button>
    <button onclick="interactContract('MessageBoard')">💬 MessageBoard</button>
  </div>

  <div id="interaction"></div>

  <script src="abis.js"></script>
  <script src="wc-scripts.js"></script>
</body>
</html>
